<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Viewer</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c0c14;
        color: rgba(255, 255, 255, 0.8);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #viewer {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      canvas:active {
        cursor: grabbing;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        gap: 18px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(15, 18, 32, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        pointer-events: none;
      }

      .hint kbd {
        display: inline-flex;
        align-items: center;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.75);
        font: inherit;
      }

      .stop-label {
        position: fixed;
        z-index: 3;
        max-width: 19rem;
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(15, 18, 32, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        color: rgba(255, 255, 255, 0.92);
        opacity: 0;
        transition: opacity 260ms ease;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 18px));
      }

      .stop-label.visible {
        opacity: 1;
      }

      .stop-label b {
        display: block;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .stop-label span {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.62);
      }

      .stop-dot {
        position: fixed;
        z-index: 2;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 999px;
        background: #ff6b35;
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.25);
        opacity: 0;
        transition: opacity 260ms ease;
        pointer-events: none;
      }

      .stop-dot.visible {
        opacity: 1;
      }

      .error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at top, #151a2e, #0c0c14 65%);
        color: rgba(255, 255, 255, 0.82);
      }

      .error.visible {
        display: flex;
      }

      .error-card {
        max-width: 34rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        padding: 28px;
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.4);
      }

      .error-card h1 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }

      .error-card p {
        margin: 0;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.62);
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div class="hint" id="hint">
      <span><kbd>Drag</kbd> Rotate</span>
      <span><kbd>Scroll</kbd> Zoom</span>
      <span><kbd>Right drag</kbd> Pan</span>
    </div>
    <div class="stop-dot" id="stop-dot"></div>
    <div class="stop-label" id="stop-label"><b id="stop-title"></b><span id="stop-blurb"></span></div>
    <div class="error" id="error">
      <div class="error-card">
        <h1>3D viewer could not be initialized</h1>
        <p id="error-message">The board geometry or rendering context failed to load.</p>
      </div>
    </div>

    <script src="/portfolio/assets/viewers/vendor/three.min.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const assetParam = params.get("asset");
        const asset = assetParam === "control" || assetParam === "brick" ? assetParam : "power";
        const cinematic = params.get("mode") === "cinematic";
        const probeStop = params.get("probe");
        const mount = document.getElementById("viewer");
        const hint = document.getElementById("hint");
        const errorEl = document.getElementById("error");
        const errorMessageEl = document.getElementById("error-message");
        const stopDot = document.getElementById("stop-dot");
        const stopLabel = document.getElementById("stop-label");
        const stopTitle = document.getElementById("stop-title");
        const stopBlurb = document.getElementById("stop-blurb");

        let renderer;
        let scene;
        let camera;
        let boardGroup;
        let maxDimension = 100;
        let state;
        let defaults;
        let wireframe = false;
        let drag = null;
        let touch = null;
        let playing = false;
        let orbitFrame = 0;
        let orbitElapsed = 0;
        let orbitLast = 0;
        let renderPending = 0;
        const ORBIT_DURATION_MS = 12000;
        let tourStops = [];
        let tourPhaseNow = { kind: "orbit", progress: 0 };
        const TOUR_TIMING = { orbitMs: 12000, travelMs: 1500, holdMs: 3000 };

        function showError(message) {
          errorMessageEl.textContent = message;
          errorEl.classList.add("visible");
        }

        function updateCamera() {
          camera.position.set(
            state.tx + state.r * Math.sin(state.phi) * Math.cos(state.theta),
            state.ty + state.r * Math.cos(state.phi),
            state.tz + state.r * Math.sin(state.phi) * Math.sin(state.theta),
          );
          camera.lookAt(state.tx, state.ty, state.tz);
          requestRender();
        }

        function resize() {
          const width = mount.clientWidth;
          const height = mount.clientHeight;
          if (!width || !height) {
            return;
          }

          renderer.setSize(width, height);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }

        function resetView() {
          Object.assign(state, defaults);
          updateCamera();
        }

        function topView() {
          state.theta = Math.PI / 2;
          state.phi = 0.04;
          state.r = maxDimension * 1.2;
          state.tx = 0;
          state.ty = 0;
          state.tz = 0;
          updateCamera();
        }

        /**
         * The cinematic camera path, and the only copy of it. One full
         * revolution, diving low and close through the midpoint: `dive` is 0 at
         * both ends and 1 in the middle. e2e/board-spin.spec.ts pins these exact
         * constants, so a change here fails there on purpose.
         */
        function spinPose(progress) {
          const t = Math.min(1, Math.max(0, progress));
          const dive = Math.sin(Math.PI * t);
          return {
            theta: -0.5 + t * Math.PI * 2,
            phi: 1.25 - dive * 0.7,
            // Two breaths per revolution: dive gives the single dip toward the
            // midpoint, breathe adds the in and out on top of it.
            radiusScale: 1.35 - dive * 0.35 - Math.sin(t * Math.PI * 4) * 0.08,
          };
        }

        function applySpin(progress) {
          const pose = spinPose(progress);
          state.theta = pose.theta;
          state.phi = pose.phi;
          state.r = maxDimension * pose.radiusScale;
          state.tx = 0;
          state.ty = 0;
          state.tz = 0;
          updateCamera();
        }

        function renderFrame() {
          resize();
          renderer.render(scene, camera);
        }

        /**
         * Mirror of src/app/src/app/lib/tour-timeline.ts, which is the tested
         * copy. This file is a plain script with no module loader, so the
         * arithmetic is duplicated on purpose; change both together.
         */
        function easeInOut(t) {
          const x = Math.min(1, Math.max(0, t));
          return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
        }

        function tourPhase(elapsedMs, stopCount, timing) {
          if (stopCount <= 0) {
            return { kind: "orbit", progress: (Math.max(0, elapsedMs) % timing.orbitMs) / timing.orbitMs };
          }

          const cycleMs = timing.orbitMs + stopCount * (timing.travelMs + timing.holdMs) + timing.travelMs;
          let t = Math.max(0, elapsedMs) % cycleMs;

          if (t < timing.orbitMs) {
            return { kind: "orbit", progress: t / timing.orbitMs };
          }

          t -= timing.orbitMs;

          for (let index = 0; index < stopCount; index += 1) {
            if (t < timing.travelMs) {
              return { kind: "travel", from: index - 1, to: index, progress: t / timing.travelMs };
            }

            t -= timing.travelMs;

            if (t < timing.holdMs) {
              return { kind: "hold", stop: index, progress: t / timing.holdMs };
            }

            t -= timing.holdMs;
          }

          return { kind: "travel", from: stopCount - 1, to: -1, progress: t / timing.travelMs };
        }

        /** The camera pose that frames one stop head on. */
        function stopPose(stop) {
          const world = boardLocalToWorld(stop.x, stop.y);
          // Look in from the part's own side of the board rather than a fixed
          // heading, or a tall part elsewhere on the board (e.g. the J15 Molex)
          // can sit between the camera and the target and block it. A part
          // sitting right at the board centre has no meaningful outward
          // direction, so fall back to the orbit's own start heading there.
          const outward = Math.hypot(world.x, world.z);
          const theta = outward < 1 ? -0.5 : Math.atan2(world.z, world.x);
          return {
            tx: world.x,
            ty: world.y,
            tz: world.z,
            // Enough distance to hold the part plus a margin in frame. Floor
            // of 20 verified against the 7.45mm level-shift transistor pair;
            // the 1.5x scale keeps the 13.45mm MCU at roughly the same 20mm.
            r: Math.max(20, stop.span * 1.5),
            phi: 0.55,
            theta: theta,
          };
        }

        /** The orbit's own pose, as a target the tour can blend against. */
        function orbitPose(progress) {
          const pose = spinPose(progress);
          return { tx: 0, ty: 0, tz: 0, r: maxDimension * pose.radiusScale, phi: pose.phi, theta: pose.theta };
        }

        function applyPose(pose) {
          state.tx = pose.tx;
          state.ty = pose.ty;
          state.tz = pose.tz;
          state.r = pose.r;
          state.phi = pose.phi;
          state.theta = pose.theta;
          updateCamera();
        }

        function blendPose(a, b, amount) {
          const k = easeInOut(amount);
          state.tx = a.tx + (b.tx - a.tx) * k;
          state.ty = a.ty + (b.ty - a.ty) * k;
          state.tz = a.tz + (b.tz - a.tz) * k;
          state.r = a.r + (b.r - a.r) * k;
          state.phi = a.phi + (b.phi - a.phi) * k;
          state.theta = a.theta + (b.theta - a.theta) * k;
          updateCamera();
        }

        function poseFor(index, progress) {
          return index < 0 ? orbitPose(progress) : stopPose(tourStops[index]);
        }

        function applyTour(elapsedMs) {
          const phase = tourPhase(elapsedMs, tourStops.length, TOUR_TIMING);
          tourPhaseNow = phase;

          if (phase.kind === "orbit") {
            applySpin(phase.progress);
          } else if (phase.kind === "hold") {
            applyPose(stopPose(tourStops[phase.stop]));
          } else {
            // Travelling in or out of the orbit uses the orbit's end heading so
            // the camera leaves and rejoins the spin without a jump.
            blendPose(poseFor(phase.from, 1), poseFor(phase.to, 0), phase.progress);
          }

          renderStopLabel(phase);
        }

        /**
         * The label is anchored to the part itself, so it has to be reprojected
         * every frame while the camera is moving. It fades in only during the
         * hold, which is when the camera is still enough to read it.
         */
        function renderStopLabel(phase) {
          const holding = phase.kind === "hold";
          const index = holding ? phase.stop : -1;
          const stop = index >= 0 ? tourStops[index] : null;

          if (!stop) {
            stopDot.classList.remove("visible");
            stopLabel.classList.remove("visible");
            return;
          }

          if (stopTitle.textContent !== stop.label) {
            stopTitle.textContent = stop.label;
            stopBlurb.textContent = stop.blurb;
          }

          const screen = worldToScreen(boardLocalToWorld(stop.x, stop.y));
          stopDot.style.left = screen.x + "px";
          stopDot.style.top = screen.y + "px";
          stopLabel.style.left = screen.x + "px";
          stopLabel.style.top = screen.y + "px";
          stopDot.classList.add("visible");
          stopLabel.classList.add("visible");
        }

        window.__boardTour = function () {
          const phase = tourPhaseNow;
          const index = phase.kind === "hold" ? phase.stop : -1;
          return {
            phase: phase.kind,
            stop: index,
            label: index >= 0 && tourStops[index] ? tourStops[index].label : null,
          };
        };

        /**
         * Board-local millimetres to world space. The group carries a -90 degree
         * x rotation, sometimes a z rotation, and a recentring offset, so let
         * Three apply the matrix rather than reimplementing it here.
         */
        function boardLocalToWorld(x, y) {
          return boardGroup.localToWorld(new THREE.Vector3(x, y, 0));
        }

        /** Projects a world point to canvas pixels, for label placement. */
        function worldToScreen(point) {
          const projected = point.clone().project(camera);
          return {
            x: (projected.x * 0.5 + 0.5) * mount.clientWidth,
            y: (-projected.y * 0.5 + 0.5) * mount.clientHeight,
          };
        }

        /**
         * Neither mode runs a permanent loop: the board is a static scene that
         * only needs a frame when something actually moved. Invalidations are
         * coalesced into one rAF so a burst of mousemove events paints once.
         * While the orbit is playing it is already drawing every frame.
         */
        function requestRender() {
          if (renderPending || playing) {
            return;
          }

          renderPending = requestAnimationFrame(function () {
            renderPending = 0;
            renderFrame();
          });
        }

        /**
         * Interactive mode redraws forever because a drag can move the camera
         * at any moment. Cinematic mode draws only while its orbit is playing,
         * so a showcase that has scrolled out of view costs nothing at all.
         */
        function orbitLoop(now) {
          if (!playing) {
            return;
          }

          orbitElapsed += now - orbitLast;
          orbitLast = now;
          applyTour(orbitElapsed);
          renderFrame();
          orbitFrame = requestAnimationFrame(orbitLoop);
        }

        // Resuming picks the orbit up where it paused rather than snapping back
        // to the start, so a board that scrolls away and returns looks continuous.
        function playOrbit() {
          if (playing || !cinematic) {
            return;
          }

          playing = true;
          orbitLast = performance.now();
          orbitFrame = requestAnimationFrame(orbitLoop);
        }

        function pauseOrbit() {
          playing = false;
          if (orbitFrame) {
            cancelAnimationFrame(orbitFrame);
            orbitFrame = 0;
          }

          stopDot.classList.remove("visible");
          stopLabel.classList.remove("visible");
        }

        function toggleWireframe() {
          wireframe = !wireframe;
          boardGroup.traverse(function (node) {
            if (!node.isMesh) {
              return;
            }

            const materials = Array.isArray(node.material) ? node.material : [node.material];
            materials.forEach(function (material) {
              if (material && "wireframe" in material) {
                material.wireframe = wireframe;
              }
            });
          });
        }

        function bindControls(canvas) {
          canvas.addEventListener("contextmenu", function (event) {
            event.preventDefault();
          });

          canvas.addEventListener("mousedown", function (event) {
            drag = { button: event.button, x: event.clientX, y: event.clientY, snapshot: Object.assign({}, state) };
            hint.style.opacity = "0";
          });

          window.addEventListener("mouseup", function () {
            drag = null;
          });

          window.addEventListener("mousemove", function (event) {
            if (!drag) {
              return;
            }

            const dx = event.clientX - drag.x;
            const dy = event.clientY - drag.y;

            if (drag.button === 0) {
              state.theta = drag.snapshot.theta - dx * 0.011;
              state.phi = Math.max(0.04, Math.min(Math.PI - 0.04, drag.snapshot.phi - dy * 0.011));
            } else if (drag.button === 2) {
              const panScale = state.r * 0.0013;
              state.tx = drag.snapshot.tx - Math.cos(state.theta) * dx * panScale;
              state.ty = drag.snapshot.ty + dy * panScale;
              state.tz = drag.snapshot.tz + Math.sin(state.theta) * dx * panScale;
            }

            updateCamera();
          });

          canvas.addEventListener(
            "wheel",
            function (event) {
              event.preventDefault();
              state.r = Math.max(maxDimension * 0.1, Math.min(maxDimension * 10, state.r * (1 + event.deltaY * 0.0009)));
              updateCamera();
              hint.style.opacity = "0";
            },
            { passive: false },
          );

          canvas.addEventListener(
            "touchstart",
            function (event) {
              event.preventDefault();
              hint.style.opacity = "0";

              if (event.touches.length === 1) {
                touch = {
                  count: 1,
                  x: event.touches[0].clientX,
                  y: event.touches[0].clientY,
                  snapshot: Object.assign({}, state),
                };
              } else if (event.touches.length === 2) {
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                touch = {
                  count: 2,
                  distance: Math.hypot(dx, dy),
                  snapshot: Object.assign({}, state),
                };
              }
            },
            { passive: false },
          );

          canvas.addEventListener(
            "touchmove",
            function (event) {
              event.preventDefault();
              if (!touch) {
                return;
              }

              if (touch.count === 1 && event.touches.length === 1) {
                state.theta = touch.snapshot.theta - (event.touches[0].clientX - touch.x) * 0.011;
                state.phi = Math.max(0.04, Math.min(Math.PI - 0.04, touch.snapshot.phi - (event.touches[0].clientY - touch.y) * 0.011));
              } else if (touch.count === 2 && event.touches.length >= 2) {
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                state.r = Math.max(maxDimension * 0.1, Math.min(maxDimension * 10, touch.snapshot.r * (touch.distance / Math.hypot(dx, dy))));
              }

              updateCamera();
            },
            { passive: false },
          );

          canvas.addEventListener("touchend", function () {
            touch = null;
          });
        }

        /**
         * Fetches one board's quantized binary payload. See
         * tools/build-board-geometry-bin.mjs for the format.
         *
         * The payload is gzip-compressed on disk so the transfer stays small
         * regardless of what the host negotiates. Whether it arrives still
         * compressed depends on the server: one that recognises the file as
         * gzip sets Content-Encoding and the browser inflates it before fetch
         * resolves, while one that treats it as opaque bytes hands it over
         * untouched. Sniff the gzip magic instead of assuming either - piping
         * already-inflated bytes through DecompressionStream throws
         * "Failed to decode data".
         */
        async function fetchBoardGeometry(assetName) {
          const url = "/portfolio/assets/viewers/geometry/" + assetName + ".pcbgeo";
          const fetchOptions = typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function"
            ? { signal: AbortSignal.timeout(15000) }
            : {};
          const response = await fetch(url, fetchOptions);
          if (!response.ok) {
            throw new Error("Board geometry failed to load (" + response.status + ").");
          }

          const raw = new Uint8Array(await response.arrayBuffer());
          let buffer;

          if (raw.length > 2 && raw[0] === 0x1f && raw[1] === 0x8b) {
            if (typeof DecompressionStream !== "function") {
              throw new Error("This browser cannot decompress the board geometry.");
            }

            const stream = new Response(raw).body.pipeThrough(new DecompressionStream("gzip"));
            buffer = await new Response(stream).arrayBuffer();
          } else {
            // Already inflated in transit - use the bytes as they arrived.
            buffer = raw.buffer.slice(raw.byteOffset, raw.byteOffset + raw.byteLength);
          }

          const view = new DataView(buffer);

          if (String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3)) !== "PCBG") {
            throw new Error("Board geometry payload is corrupt.");
          }

          const version = view.getUint32(4, true);
          if (version !== 1) {
            throw new Error("Unsupported board geometry version " + version + ".");
          }

          const headerLength = view.getUint32(8, true);
          const headerText = new TextDecoder().decode(new Uint8Array(buffer, 12, headerLength));
          const header = JSON.parse(headerText.replace(/\0+$/, ""));

          return { header: header, payload: buffer, payloadStart: 12 + headerLength };
        }

        /** Expands one mesh's Uint16 positions back to millimetre floats. */
        function decodePositions(bundle, entry) {
          const count = entry.vertexCount;
          const quantized = new Uint16Array(bundle.payload, bundle.payloadStart + entry.positionOffset, count * 3);
          const positions = new Float32Array(count * 3);

          for (let axis = 0; axis < 3; axis += 1) {
            const base = axis * count;
            const min = entry.min[axis];
            const scale = entry.scale[axis];
            for (let v = 0; v < count; v += 1) {
              positions[v * 3 + axis] = min + (quantized[base + v] / 65535) * scale;
            }
          }

          return positions;
        }

        function createBundleGroup(bundle) {
          const meshes = bundle.header.meshes;
          if (!meshes || !meshes.length) {
            throw new Error("Board geometry is missing.");
          }

          const group = new THREE.Group();

          for (const meshData of meshes) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute("position", new THREE.BufferAttribute(decodePositions(bundle, meshData), 3));
            const IndexArray = meshData.indexType === "u32" ? Uint32Array : Uint16Array;
            geometry.setIndex(
              new THREE.BufferAttribute(
                new IndexArray(bundle.payload, bundle.payloadStart + meshData.indexOffset, meshData.indexCount),
                1,
              ),
            );
            // Normals are never stored - recomputing matches what the power and
            // control boards have always done.
            geometry.computeVertexNormals();

            const r = meshData.color[0];
            const g = meshData.color[1];
            const b = meshData.color[2];
            const isGold = r > 0.6 && g > 0.5 && b < 0.4;
            const isSilver = r > 0.68 && g > 0.68 && b > 0.68 && Math.abs(r - g) < 0.06;

            const material = new THREE.MeshPhysicalMaterial({
              color: new THREE.Color(r, g, b),
              metalness: isGold ? 0.65 : isSilver ? 0.55 : 0.0,
              roughness: isGold ? 0.25 : isSilver ? 0.35 : 0.82,
              side: THREE.DoubleSide,
            });

            group.add(new THREE.Mesh(geometry, material));
          }

          group.rotation.x = -Math.PI / 2;
          group.rotation.z = asset === "control" ? -Math.PI / 2 : 0;
          return group;
        }

        async function buildScene() {
          if (!window.THREE) {
            throw new Error("Three.js failed to load.");
          }

          const brickLightingBoost = asset === "brick";

          renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setClearColor(0x0c0c14, 1);
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = brickLightingBoost ? 1.23 : 1.15;
          mount.appendChild(renderer.domElement);

          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(52, 1, 0.1, 5000);
          boardGroup = createBundleGroup(await fetchBoardGeometry(asset));

          const box = new THREE.Box3().setFromObject(boardGroup);
          const center = new THREE.Vector3();
          box.getCenter(center);
          boardGroup.position.sub(center);
          scene.add(boardGroup);

          const recenteredBox = new THREE.Box3().setFromObject(boardGroup);
          const size = new THREE.Vector3();
          recenteredBox.getSize(size);
          maxDimension = Math.max(size.x, size.y, size.z);

          camera.near = maxDimension * 0.01;
          camera.far = maxDimension * 10;
          camera.updateProjectionMatrix();

          const grid = new THREE.GridHelper(maxDimension * 3, 40, 0x141a28, 0x0e1320);
          grid.position.y = recenteredBox.min.y - 0.002;
          scene.add(grid);

          scene.add(new THREE.AmbientLight(0x8898c8, brickLightingBoost ? 0.68 : 0.6));
          const key = new THREE.DirectionalLight(0xffffff, brickLightingBoost ? 1.05 : 0.95);
          key.position.set(1, 2, 1.5);
          scene.add(key);
          const fill = new THREE.DirectionalLight(0xc0d4ff, brickLightingBoost ? 0.52 : 0.45);
          fill.position.set(-1.5, 1, -0.8);
          scene.add(fill);
          const rim = new THREE.DirectionalLight(0x50e890, brickLightingBoost ? 0.24 : 0.2);
          rim.position.set(0, -1, -1.5);
          scene.add(rim);

          defaults = {
            theta: -0.5,
            phi: 1.0,
            r: maxDimension * 1.5,
            tx: 0,
            ty: 0,
            tz: 0,
          };
          state = Object.assign({}, defaults);
          window.__boardViewerState = state;
          // Lets e2e assert the play/pause state machine directly. Frame rate
          // is not a contract: a software renderer may deliver very few frames.
          window.__boardViewerOrbit = function () {
            return { playing: playing, elapsed: orbitElapsed };
          };
          updateCamera();
          resize();
          if (cinematic) {
            hint.style.display = "none";
            renderer.domElement.style.cursor = "default";
            applySpin(0);

            if (probeStop) {
              fetch("/portfolio/assets/viewers/tours/" + asset + ".tour.json")
                .then(function (response) { return response.json(); })
                .then(function (tour) {
                  const stop = tour.stops.filter(function (s) { return s.id === probeStop; })[0];
                  if (!stop) {
                    return;
                  }

                  const world = boardLocalToWorld(stop.x, stop.y);
                  // Straight down on the stop, close enough to identify the part.
                  state.tx = world.x;
                  state.ty = world.y;
                  state.tz = world.z;
                  state.phi = 0.05;
                  state.r = 26;
                  updateCamera();
                  window.__boardProbe = function () {
                    return { id: stop.id, world: { x: world.x, y: world.y, z: world.z }, screen: worldToScreen(world) };
                  };
                });
            }

            fetch("/portfolio/assets/viewers/tours/" + asset + ".tour.json")
              .then(function (response) { return response.ok ? response.json() : null; })
              .then(function (tour) {
                if (tour && tour.stops) {
                  tourStops = tour.stops;
                }
              })
              .catch(function () {
                // No tour for this board. The plain orbit is the fallback.
              });

            renderFrame();
          } else {
            bindControls(renderer.domElement);
            renderFrame();
          }

          notifyHost("viewer-ready");
        }

        // Lets the embedding page swap its loading skeleton for the live canvas
        // only once geometry is actually on screen.
        function notifyHost(type) {
          if (window.parent === window) {
            return;
          }

          window.parent.postMessage({ type: type }, window.location.origin);
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin || !event.data || typeof event.data.type !== "string") {
            return;
          }

          if (!camera || !boardGroup) {
            return;
          }

          if (event.data.type === "reset") {
            resetView();
          } else if (event.data.type === "top") {
            topView();
          } else if (event.data.type === "wireframe") {
            toggleWireframe();
            requestRender();
          } else if (event.data.type === "spin") {
            if (cinematic && typeof event.data.progress === "number" && Number.isFinite(event.data.progress)) {
              pauseOrbit();
              applySpin(event.data.progress);
              renderFrame();
            }
          } else if (event.data.type === "play") {
            playOrbit();
          } else if (event.data.type === "pause") {
            pauseOrbit();
          }
        });

        window.addEventListener("resize", function () {
          if (renderer) {
            requestRender();
          }
        });

        // The permanent render loop used to re-fit the canvas every frame, which
        // also covered the container changing size without a window resize: the
        // modal animating open, or the page settling. Watch the mount directly
        // instead, or the canvas renders at a stale size.
        if (typeof ResizeObserver === "function") {
          new ResizeObserver(function () {
            if (renderer) {
              requestRender();
            }
          }).observe(mount);
        }

        Promise.resolve(buildScene()).catch(function (error) {
          showError(error instanceof Error ? error.message : "Unknown viewer error.");
          notifyHost("viewer-error");
        });
      })();
    </script>
  </body>
</html>
