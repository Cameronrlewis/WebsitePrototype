name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Weekly health check: both e2e suites plus the live-site check below.
  # 13:00 UTC is 09:00 Toronto in summer and 08:00 in winter.
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Exercises the actual production bundle (vite build + vite preview) rather
  # than the dev server, since the build runs through the rollup ->
  # @rollup/wasm-node alias workaround. On pushes to main this same run happens
  # inside pages.yml's build job, where it gates the deploy - so skip it here on
  # push to avoid paying for it twice, and keep it for pull requests, which are
  # the place a bundle-only break should surface before merge.
  e2e-preview:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run e2e against production preview
        run: pnpm e2e
        env:
          E2E_TARGET: preview

      # Scheduled runs only: they build main, which should be exactly what Pages
      # is serving. On a pull request the branch build differs from live by design.
      - name: Live site serves this build
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          site=https://cameron-lewis.com
          # Read the entry chunk from index.html, exactly as the live check does.
          # Globbing dist/assets/ can match more than one index-*.js chunk.
          built=$(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          live=$(curl -fsS "$site/" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)
          echo "built: $built"
          echo "live:  $live"
          [ "$built" = "$live" ] || { echo "::error::Live site is not serving main's build"; exit 1; }
          for path in / /portfolio/assets/bom/brick-buck/IBOM.html /portfolio/assets/bom/power/IBOM.html /portfolio/assets/bom/control/IBOM.html; do
            curl -fsS -o /dev/null "$site$path" && echo "200 $path"
          done

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7
